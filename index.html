<body>
  <div id="app"><p>Зареждане на картите…</p></div>
  <script>const row = i => Math.floor(i / 3);
const adjacent = (a, b) => Math.abs(row(a) - row(b)) + Math.abs(a % 3 - b % 3) === 1;
const diagonal = (a, b) => Math.abs(row(a) - row(b)) === 1 && Math.abs(a % 3 - b % 3) === 1;
const sameDiagonal = (a, b) => a !== b && Math.abs(row(a) - row(b)) === Math.abs(a % 3 - b % 3);

function power(state, player, index, defending = false) {
  const board = state.boards[player];
  const card = board[index];
  if (!card) throw new Error('Empty slot');
  let value = card.power + card.modifiers.reduce((sum, m) => sum + m.value, 0);
  if (!card.faceUp) return value;
  const others = board.map((c, i) => ({ c, i })).filter(({ c, i }) => c && i !== index);
  if (card.id === 'pack-fighter' && others.some(({ c, i }) => c.faceUp && row(i) === row(index))) value++;
  if (card.id === 'lastroot' && !others.some(({ i }) => row(i) === row(index))) value += 2;
  if (card.id === 'avenger' && board.some((c, i) => !c && row(i) === row(index))) value += 2;
  for (const { c, i } of others) {
    if (!c.faceUp) continue;
    if (c.id === 'shieldmate' && defending && row(i) === row(index)) value++;
    if (c.id === 'bishop' && diagonal(i, index)) value++;
  }
  return value;
}

function powerSources(state, player, index, defending = false) {
  const board = state.boards[player], card = board[index];
  if (!card?.faceUp) return [];
  const sources = card.modifiers.map(modifier => modifier.sourceName || (modifier.source === 'warleader' ? 'Warleader' : modifier.source)).filter(Boolean);
  const others = board.map((c, i) => ({c, i})).filter(({c, i}) => c && i !== index);
  if (card.id === 'pack-fighter' && others.some(({c, i}) => c.faceUp && row(i) === row(index))) sources.push('Pack Fighter');
  if (card.id === 'lastroot' && !others.some(({i}) => row(i) === row(index))) sources.push('Lastroot');
  if (card.id === 'avenger' && board.some((c, i) => !c && row(i) === row(index))) sources.push('Avenger');
  for (const {c, i} of others) {
    if (!c.faceUp) continue;
    if (c.id === 'shieldmate' && defending && row(i) === row(index)) sources.push('Shieldmate');
    if (c.id === 'bishop' && diagonal(i, index)) sources.push('Bishop');
  }
  return [...new Set(sources)];
}

function attackBonus(state, attackerIndex, targetIndex, revealedToAttack) {
  const card = state.boards[state.active][attackerIndex];
  const enemy = state.boards[1 - state.active];
  if (card.id === 'breachfighter' && enemy.some((c, i) => !c && row(i) === row(targetIndex))) return 1;
  if (card.id === 'executioner' && !enemy.some((c, i) => c && i !== targetIndex && row(i) === row(targetIndex))) return 2;
  if (card.id === 'ambusher' && revealedToAttack) return 1;
  if (card.id === 'linebreaker' && revealedToAttack && enemy.some((c, i) => c?.faceUp && row(i) === row(targetIndex))) return 1;
  return 0;
}




const ensure = (condition, message) => { if (!condition) throw new Error(message); };
const slots = board => board.flatMap((c, i) => c ? [i] : []);
const log = (s, text, player = s.active) => s.log.push({ turn: s.turn, player, text });
function createGame(decks, catalog, startingPlayer = Math.random() < .5 ? 0 : 1, rules = {}) {
  ensure(startingPlayer === 0 || startingPlayer === 1, 'Invalid starting player');
  ensure(decks.length === 2 && decks.every(d => d.length === 9), 'Всеки играч трябва да има точно 9 карти.');
  const boards = decks.map((deck, player) => deck.map((id, position) => {
    const definition = catalog.find(c => c.id === id);
    ensure(definition?.active, 'Непозната или неактивна карта.');
    return { ...structuredClone(definition), uid: `${player}-${position}`, owner: player, controller: player, position, faceUp: false, modifiers: [], attacked: false, wounds: 0 };
  }));
  return { boards, discard: [[], []], phase: 'hidden', stage: 'idle', active: startingPlayer, hiddenStarter: startingPlayer, revealedStarter: null, turn: 1, completedTurns: [0, 0], pending: null, result: null, rules: { experimentalWounds: Boolean(rules.experimentalWounds) }, log: [{ turn: 1, player: startingPlayer, text: `Начало · Играч ${startingPlayer + 1}${rules.experimentalWounds ? ' · експеримент с рани' : ''}` }] };
}

function legalAttackers(s) {
  if (s.stage !== 'idle' || s.result || !['hidden', 'revealed'].includes(s.phase)) return [];
  return slots(s.boards[s.active]).filter(i => s.phase === 'hidden' ? !s.boards[s.active][i].faceUp : s.boards[s.active][i].faceUp && !s.boards[s.active][i].attacked);
}
function legalTargets(s) {
  if (s.stage === 'target') return slots(s.boards[1 - s.active]).filter(i => s.phase === 'hidden' ? !s.boards[1 - s.active][i].faceUp && row(i) === row(s.pending.attacker) : s.boards[1 - s.active][i].faceUp);
  if (s.stage === 'rampager') return slots(s.boards[1 - s.active]).filter(i => s.boards[1 - s.active][i].faceUp && adjacent(i, s.pending.target));
  return [];
}
function choicePlayer(s) { return s.stage === 'warleader' ? s.pending.choice.owner : s.active; }
function supportTargets(s) {
  if (s.stage !== 'warleader') return [];
  const { owner, index } = s.pending.choice;
  return slots(s.boards[owner]).filter(i => i !== index && s.boards[owner][i].faceUp);
}
function stingerOptions(s, index) {
  const card = s.boards[s.active][index];
  if (s.stage !== 'idle' || !['hidden', 'revealed'].includes(s.phase) || s.result || !card?.faceUp || card.id !== 'stinger' || (s.phase === 'revealed' && card.attacked)) return { sacrifices: [], targets: [] };
  const forcedTargets = slots(s.boards[1 - s.active]).filter(i => s.phase === 'hidden' ? !s.boards[1 - s.active][i].faceUp && row(i) === row(index) : s.boards[1 - s.active][i].faceUp);
  if (!forcedTargets.length) return { sacrifices: [], targets: [] };
  return { sacrifices: slots(s.boards[s.active]).filter(i => s.boards[s.active][i].faceUp && sameDiagonal(index, i)), targets: slots(s.boards[1 - s.active]).filter(i => s.boards[1 - s.active][i].faceUp) };
}
function discard(s, owner, index) {
  const card = s.boards[owner][index];
  s.discard[owner].push({ ...card, discarded: true, position: null });
  s.boards[owner][index] = null;
  log(s, `${card.name} → discard на Играч ${owner + 1}`);
}
function defeat(s, owner, index) {
  const card = s.boards[owner][index];
  if (s.rules?.experimentalWounds && !card.wounds) {
    card.wounds = 1;
    log(s, `${card.name} е ранена и остава на полето`);
    return false;
  }
  discard(s, owner, index);
  return true;
}
function checkWin(s) {
  const counts = s.boards.map(b => slots(b).length);
  if (counts.every(Boolean)) return false;
  s.result = counts[0] === counts[1] ? 'tie' : counts[0] ? 0 : 1;
  s.stage = 'finished'; s.pending = null;
  log(s, s.result === 'tie' ? 'Равенство' : `Победа за Играч ${s.result + 1}`);
  return true;
}
function endTurn(s) {
  if (checkWin(s)) return;
  s.completedTurns[s.active]++;
  for (const board of s.boards) for (const c of board) if (c) c.modifiers = c.modifiers.filter(m => s.completedTurns[m.expiresPlayer] < m.expiresCount);
  s.pending = null;
  if (s.phase === 'hidden' && s.boards.every(b => b.every(c => !c || c.faceUp))) {
    const counts = s.boards.map(b => slots(b).length);
    s.phase = 'revealed';
    s.active = counts[0] === counts[1] ? 1 - s.hiddenStarter : counts[0] < counts[1] ? 0 : 1;
    s.revealedStarter = s.active;
    // Designer confirmation, 2026-09-13: one attack per card for the whole Revealed Phase.
    s.stage = 'idle';
    log(s, `Открита фаза · Играч ${s.active + 1} започва. Всяка карта може да атакува веднъж за фазата.`);
  } else { s.active = 1 - s.active; s.stage = 'idle'; }
  s.turn++;
  if (s.phase === 'revealed' && !legalAttackers(s).length) {
    const skipped = s.active;
    s.active = 1 - s.active;
    if (legalAttackers(s).length) {
      log(s, `Играч ${skipped + 1} няма карта с налична атака · ходът се пропуска`, skipped);
    } else {
      const counts = s.boards.map(board => slots(board).length);
      s.result = counts[0] === counts[1] ? 'tie' : counts[0] > counts[1] ? 0 : 1;
      s.stage = 'finished';
      log(s, s.result === 'tie'
        ? `Край на атаките · равенство при ${counts[0]}:${counts[1]} карти`
        : `Край на атаките · Играч ${s.result + 1} печели с ${counts[s.result]}:${counts[1 - s.result]} карти`);

function reveal(s, owner, index, continuation) {
  const card = s.boards[owner][index];
  if (card.faceUp) { resume(s, continuation); return; }
  card.faceUp = true;
  log(s, `Играч ${owner + 1} разкрива ${card.name} · ред ${row(index) + 1}, колона ${index % 3 + 1}`);
  if (card.id === 'warleader' && s.boards[owner].some((c, i) => c?.faceUp && i !== index)) {

function resume(s, next) {

function battle(s) {
  const { attacker: a, target: d, bonus = false } = s.pending;
  const ac = s.boards[s.active][a], dc = s.boards[1 - s.active][d];
  const ap = power(s, s.active, a) + s.pending.attackBonus - (bonus ? 1 : 0);
  const dp = power(s, 1 - s.active, d, true) + (s.phase === 'hidden' && dc.id === 'basilisk' ? 1 : 0);
  const protectedDefender = s.phase === 'hidden' && dc.id === 'husk';
  const destroyDefender = ap >= dp && !protectedDefender;
  const attackerSnapshot = structuredClone(ac), defenderSnapshot = structuredClone(dc);
  const attackerLost = ap <= dp;
  log(s, `${ac.name} (${ap}) → ${dc.name} (${dp})${protectedDefender ? ' · Husk е защитен' : ''}`);
  const attackerDiscarded = attackerLost ? defeat(s, s.active, a) : false;
  const defenderDiscarded = destroyDefender ? defeat(s, 1 - s.active, d) : false;
  const review = {
    attacker: attackerSnapshot, defender: defenderSnapshot,
    attackerPower: ap, defenderPower: dp,

/** Pure transition: illegal actions throw without modifying the original state. */
function act(original, action) {
  const s = structuredClone(original);
  ensure(!s.result && s.result !== 0 && !['finished', 'invalid', 'rules-pending'].includes(s.stage), 'Играта е приключила или чака уточнение.');
  if (action.type === 'continue') {
    ensure(s.stage === 'battle-review' && s.pending?.review, 'Няма битка за потвърждение.');
    const afterReview = s.pending.afterReview;
    delete s.pending.review; delete s.pending.afterReview;
    if (afterReview === 'rampager') {
      s.stage = 'rampager';
      if (!legalTargets(s).length) endTurn(s);
    } else endTurn(s);
  } else if (action.type === 'attack') {
    ensure(legalAttackers(s).includes(action.index), 'Избери своя карта с налична атака.');
    s.pending = { attacker: action.index, bonus: false };
    // Validate before reveal to preserve hidden information in an invalid position.
    if (s.phase === 'hidden' && !s.boards[1 - s.active].some((c, i) => c && !c.faceUp && row(i) === row(action.index))) {
      s.stage = 'invalid'; log(s, 'Невалидно състояние: няма скрит защитник в съответния ред. Не е добавено резервно правило.'); return s;
    }
    if (s.phase === 'revealed') s.boards[s.active][action.index].attacked = true;
    reveal(s, s.active, action.index, 'target');
  } else if (action.type === 'target') {
    ensure(s.stage === 'target' && legalTargets(s).includes(action.index), 'Невалидна цел.');
    s.pending.target = action.index;
    s.pending.attackBonus = attackBonus(s, s.pending.attacker, action.index, s.phase === 'hidden');
    log(s, `Цел · Играч ${2 - s.active}, ред ${row(action.index) + 1}, колона ${action.index % 3 + 1}`);
    reveal(s, 1 - s.active, action.index, 'battle');
  } else if (action.type === 'support') {
    ensure(s.stage === 'warleader' && supportTargets(s).includes(action.index), 'Избери друга своя открита карта.');
    const { owner, continuation } = s.pending.choice;
    const expiresPlayer = 1 - owner;
    const expiresCount = s.completedTurns[expiresPlayer] + (s.active === expiresPlayer ? 2 : 1);
    s.boards[owner][action.index].modifiers.push({ value: 1, expiresPlayer, expiresCount, source: 'warleader' });
    log(s, `Warleader · ${s.boards[owner][action.index].name} +1 до края на следващия ход на Играч ${expiresPlayer + 1}`);
    delete s.pending.choice; resume(s, continuation);
  } else if (action.type === 'extra') {
    ensure(s.stage === 'rampager', 'Няма допълнителна атака.');
    if (action.index === null) { log(s, 'Rampager · отказ от допълнителна атака'); endTurn(s); }
    else {
      ensure(legalTargets(s).includes(action.index), 'Невалидна допълнителна цел.');
      s.pending.target = action.index; s.pending.bonus = true; s.pending.attackBonus = 0;
      log(s, 'Rampager · допълнителна атака с −1 Power'); battle(s);
    }
  } else if (action.type === 'stinger') {
    const opts = stingerOptions(s, action.index);
    ensure(action.sacrifices?.length === 2 && new Set(action.sacrifices).size === 2 && action.sacrifices.every(i => opts.sacrifices.includes(i)) && opts.targets.includes(action.target), 'Stinger изисква две свои открити диагонални карти и открит противник.');

    }
  } else throw new Error('Непознато действие.');
  return s;
}


function randomDeck(catalog, size = 9, random = Math.random) {
  const active = catalog.filter(card => card.active);
  const counts = new Map();
  const deck = [];
  while (deck.length < size) {
    const eligible = active.filter(card => (counts.get(card.id) || 0) < (Number(card.power) >= 3 ? 1 : 2));
    if (!eligible.length) throw new Error('Няма достатъчно карти за произволно подреждане.');
    const card = eligible[Math.floor(random() * eligible.length)];
    deck.push(card.id);
    counts.set(card.id, (counts.get(card.id) || 0) + 1);
  }
  return deck;
}


const names = items => items.length < 2 ? items[0] : `${items.slice(0, -1).join(', ')} и ${items.at(-1)}`;

function summarizeTurn(entries) {
  const texts = entries.map(entry => entry.text);
  const battle = texts.map(text => text.match(/^(.+) \((\d+)\) → (.+) \((\d+)\)/)).find(Boolean);
  const wounded = texts.map(text => text.match(/^(.+) е ранена/)).filter(Boolean).map(match => match[1]);
  const destroyed = texts.map(text => text.match(/^(.+) → discard/)).filter(Boolean).map(match => match[1]);
  const effects = texts.filter(text => /^(Warleader|Rampager|Stinger) ·/.test(text));
  const parts = [];
  if (battle) parts.push(`${battle[1]} атакува ${battle[3]} със сила ${battle[2]} срещу ${battle[4]}.`);
  if (effects.length) parts.push(`Специален ефект: ${effects.map(text => text.replace(' · ', ' — ')).join(' ')}`);
  if (wounded.length) parts.push(`${names(wounded)} ${wounded.length > 1 ? 'са ранени' : 'е ранена'}.`);
  if (destroyed.length) parts.push(`${names(destroyed)} ${destroyed.length > 1 ? 'са унищожени' : 'е унищожена'}.`);
  if (battle && !wounded.length && !destroyed.length) parts.push('И двете карти остават на полето.');
  const phase = texts.find(text => text.startsWith('Открита фаза'));
  if (phase) parts.push('Започва Откритата фаза.');
  const ending = texts.find(text => /^(Победа|Равенство|Край на атаките)/.test(text));
  if (ending) parts.push(ending.replace(/ · /g, '. '));
  if (!parts.length) {
    const meaningful = texts.filter(text => !text.startsWith('Цел ·') && !/ разкрива /.test(text));
    return meaningful.join(' ') || texts.join(' ');
  }
  return parts.join(' ');
}

function turnHistory(log, player) {
  const groups = new Map();
  for (const entry of log) {
    if (entry.player !== player) continue;
    const key = `${entry.turn}:${entry.player}`;
    if (!groups.has(key)) groups.set(key, {turn: entry.turn, player: entry.player, entries: []});
    groups.get(key).entries.push(entry);
  }
  return [...groups.values()].map(group => ({...group, summary: summarizeTurn(group.entries)}));
}

    return `<button class="slot ${visible ? c.color : 'hidden-card'} ${c.wounds ? 'wounded' : ''} ${enabled ? 'legal' : ''} ${stinger?.sacrifices.includes(i) && own ? 'selected' : ''}" data-action="board" data-player="${player}" data-index="${i}" ${enabled ? '' : 'disabled'} aria-label="${label(player)}, ред ${Math.floor(i/3)+1}, колона ${i%3+1}${visible ? ', '+escape(c.name)+', текуща сила '+effectivePower : ', скрита карта'}">${visible ? card({...c,power:displayedPower}, `${powerNote}<span class="state-label">${game.phase === 'revealed' ? c.attacked ? 'АТАКАТА Е ИЗПОЛЗВАНА' : '1 АТАКА' : c.faceUp ? 'ОТКРИТА' : 'СКРИТА · виждаш я само ти'} · ${Math.floor(i/3)+1}.${i%3+1}</span>`) : `<span class="back-mark">TT<br>BOOM</span><span class="state-label">${Math.floor(i/3)+1}.${i%3+1} · СКРИТА</span>`}</button>`;
  }).join('')}</div></section>`;
}
function play() {
  if (game.stage === 'battle-review') return battleReview();
  const stingers = game.boards[game.active].flatMap((c, i) => { const o = stingerOptions(game,i); return c?.id === 'stinger' && o.sacrifices.length >= 2 && o.targets.length ? [i] : []; });
  const history = turnHistory(game.log, historyPlayer).slice().reverse();
  const stingerControls = stinger?.awaitingChoice ? `<aside class="action-prompt"><div><b>Stinger има активируем ефект</b><span>Атакувай нормално или пожертвай две диагонално съседни открити карти.</span></div>${button('Нормална атака', 'stinger-normal')}${button('Активирай ефекта', 'stinger-effect', 'class="primary"')}</aside>` : !stinger && stingers.length ? `<aside class="action-prompt compact-prompt"><div><b>Ефектът на Stinger е наличен</b><span>Натисни Stinger или активирай ефекта директно.</span></div>${stingers.map(i=>button('Активирай Stinger', 'stinger', `class="primary" data-index="${i}"`)).join('')}</aside>` : '';
  return `<section class="play-intro"><div><span class="eyebrow">${game.phase === 'hidden' ? 'СКРИТА' : 'ОТКРИТА'} ФАЗА / ХОД ${game.turn}</span><h1>${instruction()}</h1></div>${button('Скрий екрана', 'hide')}</section>${stingerControls}${game.stage === 'rules-pending' ? '<aside class="notice"><b>Чакаме решение на дизайнера.</b> В GDD §8.2 още не е потвърдено колко пъти една карта може да атакува. Следващ играч: '+label(game.revealedStarter)+'. Състоянието е запазено; не е обявено равенство.</aside>' : ''}${game.stage === 'invalid' ? '<aside class="notice">Няма легално действие според текущите правила. Състоянието е записано в историята без измислено резервно правило.</aside>' : ''}<div class="play-layout"><div class="arena">${grid(1-viewer)}<div class="divider"><span>СРЕЩУ</span></div>${grid(viewer)}</div><aside class="sidebar"><h2>История на хода</h2><div class="history-tabs">${[0,1].map(player=>button(label(player),'history-player',`data-player="${player}" class="${historyPlayer===player?'active':''}"`)).join('')}</div>${game.stage === 'rampager' ? button('Без допълнителна атака', 'skip-extra') : ''}${stinger && !stinger.awaitingChoice ? button('Отмени Stinger', 'cancel-stinger') : ''}<details><summary>Discard piles</summary>${game.discard.map((pile,p)=>`<h3>${label(p)} · ${pile.length}</h3><p>${pile.map(c=>escape(c.name)).join(', ') || 'Няма изхвърлени карти.'}</p>`).join('')}</details><div class="section-title"><h2>${label(historyPlayer)}</h2>${button('Изтегли', 'export')}</div><ol class="history">${history.length ? history.map(item=>`<li><small>ХОД ${item.turn}</small>${escape(item.summary)}</li>`).join('') : '<li class="empty-history">Все още няма завършен ход за този играч.</li>'}</ol></aside></div>`;
}
function transition(action) {
  const oldPlayer = choicePlayer(game), oldTurn = game.turn;
  game = act(game, action); stinger = null;

}
app.addEventListener('click', event => {
  const b = event.target.closest('[data-action]'); if (!b) return;
  const a = b.dataset.action, i = Number(b.dataset.index); error = '';
  if (randomizing) return;
  try {
    if (a === 'start') started = true;
    if (a === 'ready') viewer = game ? choicePlayer(game) : setupPlayer;
    if (a === 'hide') viewer = null;
    if (a === 'catalog') showCatalog = !showCatalog;
    if (a === 'reset' && (!game && !decks.flat().some(Boolean) || confirm('Да започнем нова игра? Текущата сесия ще бъде изчистена.'))) { game = null; decks = [Array(9).fill(null),Array(9).fill(null)]; setupPlayer=0; viewer=null; stinger=null; showCatalog=false; started=false; }
    if (a === 'slot') selectedSlot = i;
    if (a === 'filter') filter = b.dataset.filter;
    if (a === 'clear') decks[setupPlayer][selectedSlot] = null;
    if (a === 'random') randomizeSetup();
    if (a === 'choose') { decks[setupPlayer][selectedSlot] = b.dataset.id; const empty = decks[setupPlayer].findIndex(x => !x); if (empty >= 0) selectedSlot = empty; }
    if (a === 'lock') {
      if (decks[setupPlayer].some(x=>!x)) throw Error('Подреди точно 9 карти.');
      if (setupPlayer === 0) { setupPlayer = 1; selectedSlot = 0; viewer = null; }
      else { game = createGame(decks, catalog, Math.random() < .5 ? 0 : 1, {experimentalWounds:true}); viewer = null; }
    }
    if (a === 'board') {
      if (stinger) {
        if (Number(b.dataset.player) === game.active) { if (stinger.sacrifices.includes(i)) stinger.sacrifices = stinger.sacrifices.filter(x=>x!==i); else if(stinger.sacrifices.length<2) stinger.sacrifices.push(i); }
        else transition({type:'stinger',index:stinger.index,sacrifices:stinger.sacrifices,target:i});
      } else if (game.stage === 'idle' && Number(b.dataset.player) === game.active && stingerOptions(game, i).sacrifices.length >= 2 && stingerOptions(game, i).targets.length) {
        stinger = {index:i,sacrifices:[],awaitingChoice:true};
      } else transition({type:({idle:'attack',target:'target',warleader:'support',rampager:'extra'})[game.stage],index:i});
    }
    if (a === 'skip-extra') transition({type:'extra',index:null});
    if (a === 'history-player') historyPlayer = Number(b.dataset.player);
    if (a === 'continue-battle') transition({type:'continue'});
    if (a === 'stinger') stinger = {index:i,sacrifices:[]};
    if (a === 'stinger-effect') stinger.awaitingChoice = false;
    if (a === 'stinger-normal') { const index=stinger.index; stinger=null; transition({type:'attack',index}); }
    if (a === 'cancel-stinger') stinger = null;
    if (a === 'export') { const url=URL.createObjectURL(new Blob([JSON.stringify({phase:game.phase,turn:game.turn,result:game.result,log:game.log},null,2)],{type:'application/json'})); const link=document.createElement('a'); link.href=url; link.download='tic-tac-boom-history.json'; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); }
  } catch(e) { error = e.message; }
  render();
});

ffect":"Avenger gains +2 Power while there is an empty slot in its row.","active":true,"pendingConfirmation":false,"notes":"Effect Type: Passive\nEffect: Avenger gains +2 Power while there is an empty slot in its row.","sourceSection":"9.2"},{"id":"stinger","name":"Stinger","color":"yellow","power":1,"effectType":"activated","effect":"Discard 2 of your face-up cards on either full diagonal passing through Stinger to discard 1 face-up opponent card. Then Stinger must immediately make its normal attack.","active":true,"pendingConfirmation":false,"notes":"Effect Type: Activated\nEffect: Discard 2 of your face-up cards on either full diagonal passing through Stinger to discard 1 face-up opponent card. Then Stinger must immediately make its normal attack.\n\n\nThe sacrificed cards must both belong to Stinger's controller.\nOnly face-up cards may be sacrificed.\nOnly a face-up opponent card may be discarded by the effect.\nThe effect does not replace Stinger's normal attack. After the effect resolves, the player must attack with Stinger and cannot choose another attacker. The effect is available only when Stinger has a legal attack target.\nTherefore, using Stinger does not disturb the normal one-for-one reveal sequence of the Hidden Phase.\nThe effect may be used whenever its conditions are satisfied during Stinger's controller's turn.\nDiagonal includes every slot along either complete diagonal passing through Stinger, not only immediately adjacent slots. A corner Stinger may use the center and the opposite corner.\nThere is no explicit once-per-game or once-per-turn restriction. Its practical repeatability is naturally limited by the requirement to discard two friendly cards on those diagonals each time.","sourceSection":"9.3"},{"id":"flipper","name":"Flipper","color":"yellow","power":3,"effectType":null,"effect":"When Flipped: You can flip a face-up card in this column face down.","active":false,"pendingConfirmation":false,"notes":"Status: Inactive — Pending Design Clarification\nOriginal Effect: When Flipped: You can flip a face-up card in this column face down.\n\n\nQuestions for Designers:\n1. Can Flipper target my cards, opponent cards, or both?\n2. Does this column refer only to my grid, or does the column continue into the opponent's grid?\n3. What is the intended game flow after a face-up card is returned face-down?\n4. How should the Hidden Phase continue if this creates an unequal number or arrangement of face-down cards between the players?\n\n\nReturning cards face-down can break the current one-for-one Hidden Phase reveal structure.\nFor that reason, Flipper remains part of GDD v0.1 but is excluded from the playable prototype until clarified.","sourceSection":"9.3"},{"id":"vanilla-ice-cream","name":"Vanilla Ice Cream","color":"yellow","power":3,"effectType":"none","effect":"","active":true,"pendingConfirmation":false,"notes":"Effect Type: None\nCopies in current prototype list: 2","sourceSection":"9.3"},{"id":"bishop","name":"Bishop","color":"yellow","power":1,"effectType":"passive","effect":"Diagonally adjacent cards gain +1 Power.","active":true,"pendingConfirmation":true,"notes":"Effect Type: Passive\nEffect: Diagonally adjacent cards gain +1 Power.\nBecause positional language refers to the card's own grid unless otherwise stated, Bishop affects friendly cards only.\n\n\nDesigner Confirmation Note:\nThe original wording states: Give +1 Power to each card in this card's diagonal.\nI am interpreting this as diagonally adjacent cards only, rather than every card located anywhere along the entire diagonal line.\nPlease confirm that this matches the original design intent.","sourceSection":"9.3"},{"id":"basilisk","name":"Basilisk","color":"yellow","power":3,"effectType":"triggered","effect":"When defending in Phase 1, gain +1 Power this turn.","active":true,"pendingConfirmation":false,"notes":"Effect Type: Triggered\nEffect: When defending in Phase 1, gain +1 Power this turn.\nBecause normal defending during Phase 1 reveals the target card before battle, this replaces the less precise original wording when attacked and flipped.","sourceSection":"9.3"},{"id":"trapper","name":"Trapper","color":"yellow","power":2,"effectType":null,"effect":"When flipped: Flip an opponent's card face-down.","active":false,"pendingConfirmation":false,"notes":"Status: Inactive — Pending Design Clarification\nOriginal Effect: When flipped: Flip an opponent's card face-down.\n\n\nQuestions for Designers:\n1. Can Trapper target any face-up opponent card?\n2. Is the target restricted by row or column?\n3. What happens if the effect creates a face-down opponent card after I no longer have a corresponding face-down card available to reveal and attack?\n4. Is there an intended special rule governing cards returned face-down during the Hidden Phase?\n\n\nThe effect can disrupt the current reveal symmetry of Phase 1.\nFor that reason, Trapper remains documented in v0.1 but is excluded from the playable prototype until clarified.","sourceSection":"9.3"},{"id":"husk","name":"Husk","color":"yellow","power":1,"effectType":"passive","effect":"During Phase 1, Husk cannot be destroyed while defending.","active":true,"pendingConfirmation":true,"notes":"Effect Type: Passive\nEffect: During Phase 1, Husk cannot be destroyed while defending.\n\n\nThis protection applies only when Husk is the defender.\nWhen Husk attacks, normal battle rules apply.\n\n\nExamples:\n- If Husk defends against a stronger attacker, Husk remains and the stronger attacker also remains.\n- If Husk defends against a weaker attacker, the attacker is discarded and Husk remains.\n- If Husk defends against an attacker with equal Power, the attacker is discarded while Husk remains because Husk's effect prevents its destruction.\n\n\nDesigner Confirmation Note:\nThe original wording states: Can't be destroyed when attacked.\nI am interpreting the intended effect as protection that applies only while defending during Phase 1.\nThis prevents Husk from becoming permanently indestructible during the Revealed Phase while retaining its intended defensive identity.\nPlease confirm.","sourceSection":"9.3"},{"id":"switcheroo","name":"Switcheroo","color":"yellow","power":2,"effectType":null,"effect":"When attacked: switch places with the attacker.","active":false,"pendingConfirmation":false,"notes":"Status: Inactive — Pending Design Clarification\nOriginal Effect: When attacked: switch places with the attacker.\n\n\nQuestions for Designers:\n1. Does the swap happen before the battle?\n2. Does the swap replace the battle entirely?\n3. Does the battle occur after the swap?\n4. If the battle occurs first and Switcheroo is destroyed, what remains to be swapped?\n5. When the cards exchange positions between the two grids, does each player then control the card occupying their own grid?\n6. How should the effect behave during the Hidden Phase when information is incomplete?\n\n\nSwitcheroo remains included in GDD v0.1 but is excluded from the playable prototype until its intended timing is confirmed.","sourceSection":"9.3"}]; render();
