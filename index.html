<body>
  <div id="app"><p>Зареждане на картите…</p></div>
  <script>const row = i => Math.floor(i / 3);
const adjacent = (a, b) => Math.abs(row(a) - row(b)) + Math.abs(a % 3 - b % 3) === 1;
const diagonal = (a, b) => Math.abs(row(a) - row(b)) === 1 && Math.abs(a % 3 - b % 3) === 1;
const sameDiagonal = (a, b) => a !== b && Math.abs(row(a) - row(b)) === Math.abs(a % 3 - b % 3);

function power(state, player, index, defending = false) {
  const board = state.boards[player];
  const card = board[index];
  if (!card) throw new Error('Empty slot');
  let value = card.power + card.modifiers.reduce((sum, m) => sum + m.value, 0);
  if (!card.faceUp) return value;
  const others = board.map((c, i) => ({ c, i })).filter(({ c, i }) => c && i !== index);
  if (card.id === 'pack-fighter' && others.some(({ c, i }) => c.faceUp && row(i) === row(index))) value++;
  if (card.id === 'lastroot' && !others.some(({ i }) => row(i) === row(index))) value += 2;
  if (card.id === 'avenger' && board.some((c, i) => !c && row(i) === row(index) && adjacent(i, index))) value += 2;
  for (const { c, i } of others) {
    if (!c.faceUp) continue;
    if (c.id === 'shieldmate' && defending && row(i) === row(index)) value++;
    if (c.id === 'bishop' && diagonal(i, index)) value++;
  }
  return value;
}

function powerSources(state, player, index, defending = false) {
  const board = state.boards[player], card = board[index];
  if (!card?.faceUp) return [];
  const sources = card.modifiers.map(modifier => modifier.sourceName || (modifier.source === 'warleader' ? 'Warleader' : modifier.source)).filter(Boolean);
  const others = board.map((c, i) => ({c, i})).filter(({c, i}) => c && i !== index);
  if (card.id === 'pack-fighter' && others.some(({c, i}) => c.faceUp && row(i) === row(index))) sources.push('Pack Fighter');
  if (card.id === 'lastroot' && !others.some(({i}) => row(i) === row(index))) sources.push('Lastroot');
  if (card.id === 'avenger' && board.some((c, i) => !c && row(i) === row(index) && adjacent(i, index))) sources.push('Avenger');
  for (const {c, i} of others) {
    if (!c.faceUp) continue;
    if (c.id === 'shieldmate' && defending && row(i) === row(index)) sources.push('Shieldmate');
    if (c.id === 'bishop' && diagonal(i, index)) sources.push('Bishop');
  }
  return [...new Set(sources)];
}

function attackBonus(state, attackerIndex, targetIndex, revealedToAttack) {
  const card = state.boards[state.active][attackerIndex];
  const enemy = state.boards[1 - state.active];
  if (card.id === 'breachfighter' && enemy.some((c, i) => !c && row(i) === row(targetIndex))) return 1;
  if (card.id === 'executioner' && !enemy.some((c, i) => c && i !== targetIndex && row(i) === row(targetIndex))) return 2;
  if (card.id === 'ambusher' && revealedToAttack) return 1;
  if (card.id === 'linebreaker' && revealedToAttack && enemy.some((c, i) => c?.faceUp && row(i) === row(targetIndex))) return 1;
  return 0;
}




const ensure = (condition, message) => { if (!condition) throw new Error(message); };
const slots = board => board.flatMap((c, i) => c ? [i] : []);
const log = (s, text, player = s.active) => s.log.push({ turn: s.turn, player, text });
function createGame(decks, catalog, startingPlayer = Math.random() < .5 ? 0 : 1, rules = {}) {
  ensure(startingPlayer === 0 || startingPlayer === 1, 'Invalid starting player');
  ensure(decks.length === 2 && decks.every(d => d.length === 9), 'Всеки играч трябва да има точно 9 карти.');
  const boards = decks.map((deck, player) => deck.map((id, position) => {
    const definition = catalog.find(c => c.id === id);
    ensure(definition?.active, 'Непозната или неактивна карта.');
    return { ...structuredClone(definition), uid: `${player}-${position}`, owner: player, controller: player, position, faceUp: false, modifiers: [], attacked: false, wounds: 0 };
  }));
  return { boards, discard: [[], []], phase: 'hidden', stage: 'idle', active: startingPlayer, hiddenStarter: startingPlayer, revealedStarter: null, turn: 1, completedTurns: [0, 0], pending: null, result: null, rules: { experimentalWounds: Boolean(rules.experimentalWounds) }, log: [{ turn: 1, player: startingPlayer, text: `Начало · Играч ${startingPlayer + 1}${rules.experimentalWounds ? ' · експеримент с рани' : ''}` }] };
}

function legalAttackers(s) {
  if (s.stage !== 'idle' || s.result || !['hidden', 'revealed'].includes(s.phase)) return [];
  return slots(s.boards[s.active]).filter(i => s.phase === 'hidden' ? !s.boards[s.active][i].faceUp : s.boards[s.active][i].faceUp && !s.boards[s.active][i].attacked);
}
function legalTargets(s) {
  if (s.stage === 'target') return slots(s.boards[1 - s.active]).filter(i => s.phase === 'hidden' ? !s.boards[1 - s.active][i].faceUp && row(i) === row(s.pending.attacker) : s.boards[1 - s.active][i].faceUp);
  if (s.stage === 'rampager') return slots(s.boards[1 - s.active]).filter(i => s.boards[1 - s.active][i].faceUp && adjacent(i, s.pending.target));
  return [];
}
function choicePlayer(s) { return s.stage === 'warleader' ? s.pending.choice.owner : s.active; }
function supportTargets(s) {
  if (s.stage !== 'warleader') return [];
  const { owner, index } = s.pending.choice;
  return slots(s.boards[owner]).filter(i => i !== index && s.boards[owner][i].faceUp);
}
function stingerEffectOptions(s, index) {
  const card = s.boards[s.active][index];
  const selectedForNormalAttack = s.stage === 'target' && s.pending?.attacker === index && !s.pending?.forcedAttacker;
  if ((!selectedForNormalAttack && s.stage !== 'idle') || s.phase !== 'revealed' || s.result || !card?.faceUp || card.id !== 'stinger' || (!selectedForNormalAttack && card.attacked)) return { sacrifices: [], targets: [] };
  const targets = slots(s.boards[1 - s.active]).filter(i => s.boards[1 - s.active][i].faceUp);
  if (targets.length < 2) return { sacrifices: [], targets: [] };
  return { sacrifices: slots(s.boards[s.active]).filter(i => s.boards[s.active][i].faceUp && sameDiagonal(index, i)), targets };
}
function stingerOptions(s, index) {
  return s.stage === 'idle' ? stingerEffectOptions(s, index) : { sacrifices: [], targets: [] };
}
function discard(s, owner, index) {
  const card = s.boards[owner][index];
  s.discard[owner].push({ ...card, discarded: true, position: null });
  s.boards[owner][index] = null;
  log(s, `${card.name} → discard на Играч ${owner + 1}`);
}
function defeat(s, owner, index) {
  const card = s.boards[owner][index];
  if (s.rules?.experimentalWounds && !card.wounds) {
    card.wounds = 1;
    log(s, `${card.name} е ранена и остава на полето`);
    return false;
  }
  discard(s, owner, index);
  return true;
}
function checkWin(s) {
  const counts = s.boards.map(b => slots(b).length);
  if (counts.every(Boolean)) return false;
  s.result = counts[0] === counts[1] ? 'tie' : counts[0] ? 0 : 1;
  s.stage = 'finished'; s.pending = null;
  log(s, s.result === 'tie' ? 'Равенство' : `Победа за Играч ${s.result + 1}`);
  return true;
}
function endTurn(s) {
  if (checkWin(s)) return;
  s.completedTurns[s.active]++;
  for (const board of s.boards) for (const c of board) if (c) c.modifiers = c.modifiers.filter(m => s.completedTurns[m.expiresPlayer] < m.expiresCount);
  s.pending = null;
  if (s.phase === 'hidden' && s.boards.every(b => b.every(c => !c || c.faceUp))) {
    const counts = s.boards.map(b => slots(b).length);
    s.phase = 'revealed';
    for (const c of s.boards.flat()) if (c) c.attackComplete = false;
    s.active = counts[0] === counts[1] ? 1 - s.hiddenStarter : counts[0] < counts[1] ? 0 : 1;
    s.revealedStarter = s.active;
    // Designer confirmation, 2026-09-13: one attack per card for the whole Revealed Phase.
    s.stage = 'idle';
    log(s, `Открита фаза · Играч ${s.active + 1} започва. Всяка карта може да атакува веднъж за фазата.`);
  } else { s.active = 1 - s.active; s.stage = 'idle'; }
  s.turn++;
  if (s.phase === 'revealed' && !legalAttackers(s).length) {
    const skipped = s.active;
    s.active = 1 - s.active;
    if (legalAttackers(s).length) {
      log(s, `Играч ${skipped + 1} няма карта с налична атака · ходът се пропуска`, skipped);
    } else {
      const counts = s.boards.map(board => slots(board).length);
      const totals = s.boards.map((board, player) => slots(board).reduce((sum, index) => sum + power(s, player, index), 0));
      s.result = counts[0] === counts[1]
        ? totals[0] === totals[1] ? 'tie' : totals[0] > totals[1] ? 0 : 1
        : counts[0] > counts[1] ? 0 : 1;
      s.stage = 'finished';
      log(s, counts[0] === counts[1]
        ? s.result === 'tie'
          ? `Край на атаките · равенство при ${counts[0]}:${counts[1]} карти и ${totals[0]}:${totals[1]} Power`
          : `Край на атаките · Играч ${s.result + 1} печели с ${counts[0]}:${counts[1]} карти и ${totals[s.result]}:${totals[1 - s.result]} Power`
        : `Край на атаките · Играч ${s.result + 1} печели с ${counts[s.result]}:${counts[1 - s.result]} карти`);
    }
  } else if (!legalAttackers(s).length) {
    s.stage = 'invalid';
    log(s, 'Невалидно състояние: няма легален нападател в Скритата фаза.');
  }
}
function reveal(s, owner, index, continuation) {
  const card = s.boards[owner][index];
  if (card.faceUp) { resume(s, continuation); return; }
  card.faceUp = true;
  log(s, `Играч ${owner + 1} разкрива ${card.name} · ред ${row(index) + 1}, колона ${index % 3 + 1}`);
  resume(s, continuation);
}
function startRevealedAttack(s, index) {
  const card = s.boards[s.active][index];
  if (card.id === 'warleader' && s.boards[s.active].some((c, i) => c?.faceUp && i !== index)) {
    s.stage = 'warleader';
    s.pending.choice = { owner: s.active, index, continuation: 'target' };
  } else s.stage = 'target';
}
function resume(s, next) {
  if (next === 'target') { s.stage = 'target'; return; }
  if (next === 'battle') battle(s);
}
function battle(s) {
  const { attacker: a, target: d, bonus = false } = s.pending;
  const ac = s.boards[s.active][a], dc = s.boards[1 - s.active][d];
  const ap = power(s, s.active, a) + s.pending.attackBonus - (bonus ? 1 : 0);
  const dp = power(s, 1 - s.active, d, true) + (s.phase === 'hidden' && dc.id === 'basilisk' ? 1 : 0);
  const protectedDefender = s.phase === 'hidden' && dc.id === 'husk';
  const destroyDefender = ap >= dp && !protectedDefender;
  const attackerSnapshot = structuredClone(ac), defenderSnapshot = structuredClone(dc);
  const attackerLost = ap <= dp;
  log(s, `${ac.name} (${ap}) → ${dc.name} (${dp})${protectedDefender ? ' · Husk е защитен' : ''}`);
  const attackerDiscarded = attackerLost ? defeat(s, s.active, a) : false;
  const defenderDiscarded = destroyDefender ? defeat(s, 1 - s.active, d) : false;
  const review = {
    attacker: attackerSnapshot, defender: defenderSnapshot,
    attackerPower: ap, defenderPower: dp,
    attackerResult: attackerLost ? attackerDiscarded ? 'destroyed' : 'wounded' : 'survived',
    defenderResult: destroyDefender ? defenderDiscarded ? 'destroyed' : 'wounded' : 'survived',
    attackerPlayer: s.active, defenderPlayer: 1 - s.active
  };
  const rampager = ac.id === 'rampager' && !bonus && defenderDiscarded && s.boards[s.active][a];
  s.pending.review = review;
  s.pending.afterReview = rampager ? 'rampager' : 'end-turn';
  s.stage = 'battle-review';
}

/** Pure transition: illegal actions throw without modifying the original state. */
function act(original, action) {
  const s = structuredClone(original);
  ensure(!s.result && s.result !== 0 && !['finished', 'invalid', 'rules-pending'].includes(s.stage), 'Играта е приключила или чака уточнение.');
  if (action.type === 'continue') {
    ensure(s.stage === 'battle-review' && s.pending?.review, 'Няма битка за потвърждение.');
    const afterReview = s.pending.afterReview;
    delete s.pending.review; delete s.pending.afterReview;
    if (afterReview === 'rampager') {
      s.stage = 'rampager';
      if (!legalTargets(s).length) endTurn(s);
    } else endTurn(s);
  } else if (action.type === 'attack') {
    ensure(legalAttackers(s).includes(action.index), 'Избери своя карта с налична атака.');
    s.pending = { attacker: action.index, attackerWasFaceUp: s.boards[s.active][action.index].faceUp, bonus: false };
    // Validate before reveal to preserve hidden information in an invalid position.
    if (s.phase === 'hidden' && !s.boards[1 - s.active].some((c, i) => c && !c.faceUp && row(i) === row(action.index))) {
      s.stage = 'invalid'; log(s, 'Невалидно състояние: няма скрит защитник в съответния ред. Не е добавено резервно правило.'); return s;
    }
    if (s.phase === 'revealed') {
      s.boards[s.active][action.index].attacked = true;
      startRevealedAttack(s, action.index);
    } else reveal(s, s.active, action.index, 'target');
  } else if (action.type === 'change-attacker') {
    ensure(s.stage === 'target' && !s.pending?.forcedAttacker, 'Избраният нападател трябва да завърши своята атака.');
    const opponent = 1 - s.active;
    const candidate = s.boards[s.active][action.index];
    const hasHiddenTarget = s.boards[opponent].some((card, index) => card && !card.faceUp && row(index) === row(action.index));
    const canChange = s.phase === 'hidden'
      ? candidate && !candidate.faceUp && hasHiddenTarget
      : candidate && candidate.faceUp && !candidate.attacked;
    ensure(canChange, 'Избери друга своя карта с налична атака.');
    const former = s.pending.attacker;
    s.boards[s.active][former].faceUp = s.pending.attackerWasFaceUp;
    if (s.phase === 'revealed') s.boards[s.active][former].attacked = false;
    s.log.pop();
    s.pending = { attacker: action.index, attackerWasFaceUp: candidate.faceUp, bonus: false };
    if (s.phase === 'revealed') {
      candidate.attacked = true;
      startRevealedAttack(s, action.index);
    } else reveal(s, s.active, action.index, 'target');
  } else if (action.type === 'target') {
    ensure(s.stage === 'target' && legalTargets(s).includes(action.index), 'Невалидна цел.');
    s.boards[s.active][s.pending.attacker].attackComplete = true;
    s.pending.target = action.index;
    s.pending.attackBonus = attackBonus(s, s.pending.attacker, action.index, s.phase === 'hidden');
    log(s, `Цел · Играч ${2 - s.active}, ред ${row(action.index) + 1}, колона ${action.index % 3 + 1}`);
    reveal(s, 1 - s.active, action.index, 'battle');
  } else if (action.type === 'support') {
    ensure(s.stage === 'warleader' && supportTargets(s).includes(action.index), 'Избери друга своя открита карта.');
    const { owner, continuation } = s.pending.choice;
    const expiresPlayer = 1 - owner;
    const expiresCount = s.completedTurns[expiresPlayer] + (s.active === expiresPlayer ? 2 : 1);
    s.boards[owner][action.index].modifiers.push({ value: 1, expiresPlayer, expiresCount, source: 'warleader' });
    log(s, `Warleader · ${s.boards[owner][action.index].name} +1 до края на следващия ход на Играч ${expiresPlayer + 1}`);
    delete s.pending.choice;
    s.pending.forcedAttacker = true;
    resume(s, continuation);
  } else if (action.type === 'extra') {
    ensure(s.stage === 'rampager', 'Няма допълнителна атака.');
    if (action.index === null) { ensure(!legalTargets(s).length, 'Rampager трябва да атакува, когато има допустима цел.'); endTurn(s); }
    else {
      ensure(legalTargets(s).includes(action.index), 'Невалидна допълнителна цел.');
      s.pending.target = action.index; s.pending.bonus = true; s.pending.attackBonus = 0;
      log(s, 'Rampager · допълнителна атака с −1 Power'); battle(s);
    }
  } else if (action.type === 'stinger') {
    const selectedForNormalAttack = s.stage === 'target' && s.pending?.attacker === action.index && !s.pending?.forcedAttacker;
    ensure(s.stage === 'idle' || selectedForNormalAttack, 'Първо избери Stinger за нападател.');
    const opts = stingerEffectOptions(s, action.index);
    ensure(action.sacrifices?.length === 2 && new Set(action.sacrifices).size === 2 && action.sacrifices.every(i => opts.sacrifices.includes(i)) && opts.targets.includes(action.target), 'Stinger изисква две свои открити диагонални карти и открит противник.');
    log(s, 'Stinger · активиран ефект');
    for (const i of action.sacrifices) discard(s, s.active, i);
    discard(s, 1 - s.active, action.target);
    if (!checkWin(s)) {
      s.pending = { attacker: action.index, attackerWasFaceUp: s.boards[s.active][action.index].faceUp, forcedAttacker: true, bonus: false };
      if (s.phase === 'revealed') s.boards[s.active][action.index].attacked = true;
      s.stage = 'target';
      log(s, 'Stinger · след ефекта трябва незабавно да направи нормалната си атака');
    }
  } else throw new Error('Непознато действие.');
  return s;
}


// One source for manual setup, random setup and final deck validation.
const DECK_LIMITS = Object.freeze({ 4: 1, 3: 2, 2: 3, 1: Infinity });
const deckLimitText = () => 'Лимити: ' + [4, 3, 2, 1].map(p => `Сила ${p} — ${Number.isFinite(DECK_LIMITS[p]) ? 'до ' + DECK_LIMITS[p] : 'без лимит'}`).join(' · ');
function canPick(deck, catalog, id, slot = -1) {
  const card = catalog.find(c => c.id === id && c.active);
  if (!card) return false;
  const count = deck.filter((other, i) => i !== slot && catalog.find(c => c.id === other)?.power === card.power).length;
  return count < (DECK_LIMITS[card.power] ?? 0);
}
function validDeck(deck, catalog) {
  return deck.length === 9 && deck.every((id, i) => canPick(deck, catalog, id, i));
}
function randomDeck(catalog, size = 9, random = Math.random) {
  const deck = [];
  while (deck.length < size) {
    const eligible = catalog.filter(card => canPick(deck, catalog, card.id));
    if (!eligible.length) throw new Error('Няма достатъчно карти за произволно подреждане.');
    deck.push(eligible[Math.floor(random() * eligible.length)].id);
  }
  return deck;
}


const names = items => items.length < 2 ? items[0] : `${items.slice(0, -1).join(', ')} и ${items.at(-1)}`;

function summarizeTurn(entries) {
  const texts = entries.map(entry => entry.text);
  const battle = texts.map(text => text.match(/^(.+) \((\d+)\) → (.+) \((\d+)\)/)).find(Boolean);
  const wounded = texts.map(text => text.match(/^(.+) е ранена/)).filter(Boolean).map(match => match[1]);
  const destroyed = texts.map(text => text.match(/^(.+) → discard/)).filter(Boolean).map(match => match[1]);
  const effects = texts.filter(text => /^(Warleader|Rampager|Stinger) ·/.test(text));
  const parts = [];
  if (battle) parts.push(`${battle[1]} атакува ${battle[3]} със сила ${battle[2]} срещу ${battle[4]}.`);
  if (effects.length) parts.push(`Специален ефект: ${effects.map(text => text.replace(' · ', ' — ')).join(' ')}`);

  if (destroyed.length) parts.push(`${names(destroyed)} ${destroyed.length > 1 ? 'са унищожени' : 'е унищожена'}.`);

  if (ending) parts.push(ending.replace(/ · /g, '. '));

    return meaningful.join(' ') || texts.join(' ');
  }
  return parts.join(' ');
}

function turnHistory(log, player) {
  const groups = new Map();
  for (const entry of log) {
    if (entry.player !== player) continue;
    const key = `${entry.turn}:${entry.player}`;
    if (!groups.has(key)) groups.set(key, {turn: entry.turn, player: entry.player, entries: []});
    groups.get(key).entries.push(entry);
  }
  return [...groups.values()].map(group => ({...group, summary: summarizeTurn(group.entries)}));
}

app.addEventListener('click', event => {

    if (a === 'filter') filter = b.dataset.filter;
    if (a === 'clear') decks[setupPlayer][selectedSlot] = null;
    if (a === 'random') randomizeSetup();

      if (stinger) {

g, you may discard 2 face-up cards on Stinger's diagonals to discard 1 face-up opponent card.","active":true,"pendingConfirmation":false,"notes":"Effect Type: Activated\nEffect: During Phase 2, discard 2 of your face-up cards on either full diagonal passing through Stinger to discard 1 face-up opponent card. Then Stinger must immediately make its normal attack.\n\n\nThe effect is available only during Phase 2 (the Revealed Phase).\nThe sacrificed cards must both belong to Stinger's controller.\nOnly face-up cards may be sacrificed.\nOnly a face-up opponent card may be discarded by the effect.\nThe effect does not replace Stinger's normal attack. After the effect resolves, the player must attack with Stinger and cannot choose another attacker. The effect is available only when Stinger has a legal attack target.\nDiagonal includes every slot along either complete diagonal passing through Stinger, not only immediately adjacent slots. A corner Stinger may use the center and the opposite corner.\nThere is no explicit once-per-game restriction. Its practical repeatability is naturally limited by the one-attack-per-card rule in Phase 2 and the requirement to discard two friendly cards on those diagonals.","sourceSection":"9.3"},{"id":"flipper","name":"Flipper","color":"yellow","power":3,"effectType":null,"effect":"When Flipped: You can flip a face-up card in this column face down.","active":false,"pendingConfirmation":false,"notes":"Status: Inactive — Pending Design Clarification\nOriginal Effect: When Flipped: You can flip a face-up card in this column face down.\n\n\nQuestions for Designers:\n1. Can Flipper target my cards, opponent cards, or both?\n2. Does this column refer only to my grid, or does the column continue into the opponent's grid?\n3. What is the intended game flow after a face-up card is returned face-down?\n4. How should the Hidden Phase continue if this creates an unequal number or arrangement of face-down cards between the players?\n\n\nReturning cards t card?\n2. Is the target restricted by row or column?\n3. What happens if the effect creates a face-down opponent card after I no longer have a corresponding face-down card available to reveal and attack?\n4. Is there an intended special rule governing cards returned face-down during the Hidden Phase?\n\n\nThe effect can disrupt the current reveal symmetry of Phase 1.\nFor that reason, Trapper remains documented in v0.1 but is excluded from the playable prototype until clarified.","sourceSection":"9.3"},{"id":"husk","name":"Husk","color":"yellow","power":1,"effectType":"passive","effect":"During Phase 1, Husk cannot be destroyed while defending.","active":true,"pendingConfirmation":true,"notes":"Effect Type: Passive\nEffect: During Phase 1, Husk cannot be destroyed while defending.\n\n\nThis protection applies only when Husk is the defender.\nWhen Husk attacks, normal battle rules apply.\n\n\nExamples:\n- If Husk defends against a stronger attacker, Husk remains and the stronger attacker also remains.\n- If Husk defends against a weaker attacker, the attacker is discarded and Husk remains.\n- If Husk defends against an attacker with equal Power, the attacker is discarded while Husk remains because Husk's effect prevents its destruction.\n\n\nDesigner Confirmation Note:\nThe original wording states: Can't be destroyed when attacked.\nI am interpreting the intended effect as protection that applies only while defending during Phase 1.\nThis prevents Husk from becoming permanently indestructible during the Revealed Phase while retaining its intended defensive identity.\nPlease confirm.","sourceSection":"9.3"},{"id":"switcheroo","name":"Switcheroo","color":"yellow","power":2,"effectType":null,"effect":"When attacked: switch places with the attacker.","active":false,"pendingConfirmation":false,"notes":"Status: Inactive — Pending Design Clarification\nOriginal Effect: When attacked: switch places with the attacker.\n\n\nQuestions for Designers:\n1. Does the swap happen before the battle?\n2. Does the swap replace the battle entirely?\n3. Does the battle occur after the swap?\n4. If the battle occurs first and Switcheroo is destroyed, what remains to be swapped?\n5. When the cards exchange positions between the two grids, does each player then control the card occupying their own grid?\n6. How should the effect behave during the Hidden Phase when information is incomplete?\n\n\nSwitcheroo remains included in GDD v0.1 but is excluded from the playable prototype until its intended timing is confirmed.","sourceSection":"9.3"}]; render();
